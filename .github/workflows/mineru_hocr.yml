name: MinerU OCR → hOCR → 生成带文本层PDF
on:
  workflow_dispatch:  # 手动触发
    inputs:
      pdf_file_path:
        description: '待处理的PDF文件路径（仓库内相对路径，如：input.pdf）'
        required: true
        default: 'input.pdf'
      mineru_lang:
        description: 'MinerU OCR识别语言（如ch/en）'
        required: true
        default: 'ch'
      output_pdf_name:
        description: '最终输出的PDF文件名'
        required: true
        default: 'output_with_text.pdf'

jobs:
  ocr-process:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 验证输入PDF文件存在
        run: |
          if [ ! -f "${{ github.event.inputs.pdf_file_path }}" ]; then
            echo "错误：指定的PDF文件 ${{ github.event.inputs.pdf_file_path }} 不存在！"
            exit 1
          fi

      - name: 安装系统依赖
        run: |
          sudo apt update
          sudo apt install -y \
            python3-pip \
            python3-venv \
            poppler-utils \
            libgl1 \
            libglib2.0-0 \
            ghostscript   # 复用gs
          # 验证关键工具安装
          gs --version


      - name: 安装MinerU
        run: |
          python3 -m venv mineru-venv
          source mineru-venv/bin/activate
          pip install --upgrade pip
          pip install uv
          uv pip install -U mineru[all] torch doclayout_yolo ultralytics  hocr-tools  pdf2image lxml # 或从源码安装：pip install git+https://github.com/opendatalab/MinerU.git
          deactivate

      - name: 运行MinerU执行OCR（生成结构化输出）
        run: |
          source mineru-venv/bin/activate
          # 创建输出目录
          mkdir -p mineru_output
          # 执行MinerU OCR解析
          mineru -p "${{ github.event.inputs.pdf_file_path }}" \
            -o mineru_output \
            -m ocr \
            -b pipeline \
            -l ${{ github.event.inputs.mineru_lang }}
          deactivate

      - name: 编写MinerU转hOCR转换脚本
        run: |
          cat > mineru_to_hocr.py << 'EOF'
          import json
          import os
          from pathlib import Path


          def convert_mineru_to_hocr(mineru_output_dir, pdf_filename, hocr_output_path):
              # 适配MinerU官网规则：{original_filename}_middle.json
              mineru_dir = Path(mineru_output_dir)
              pdf_stem = Path(pdf_filename).stem  # 提取PDF纯文件名（如input.pdf → input）
              target_json_name = f"{pdf_stem}_middle.json"  # 官方命名：input_middle.json
              ocr = "ocr"
              middle_json_path = mineru_dir / pdf_stem / ocr / target_json_name  # 完整路径：mineru_output/input/ocr/input_middle.json

              # 打印查找信息（关键日志，用于验证）
              print(f"【MinerU官方规则】预期查找的JSON文件：{target_json_name}")
              print(f"【完整查找路径】{middle_json_path.absolute()}")
              # 容错：文件不存在则递归搜索并提示，保留调试能力
              if not middle_json_path.exists():
                  print(f"【警告】未按官方规则找到文件，开始递归搜索所有middle.json...")
                  middle_json_list = list(mineru_dir.rglob("*middle.json"))
                  print(f"【递归搜索结果】找到{len(middle_json_list)}个相关文件：")
                  for idx, p in enumerate(middle_json_list):
                      print(f"  路径{idx+1}：{p.absolute()}")
                  raise FileNotFoundError(f"【错误】未找到MinerU官方格式文件{target_json_name}，请检查MinerU输出！")

              print(f"【成功匹配】找到MinerU官方格式OCR文件：{middle_json_path.absolute()}")
              # 读取MinerU官方格式的middle.json
              with open(middle_json_path, 'r', encoding='utf-8') as f:
                  mineru_data = json.load(f)
        

              # hOCR模板头部
              hocr_header = '''<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
            "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
          <html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
          <head>
            <meta http-equiv="Content-Type" content="text/html;charset=utf-8"/>
            <title>hOCR Output from MinerU</title>
            <meta name='ocr-system' content='MinerU OCR'/>
            <meta name='ocr-capabilities' content='ocr_page ocr_carea ocr_par ocr_line ocrx_word'/>
          </head>
          <body>
              '''
              hocr_footer = '''
          </body>
          </html>'''

              hocr_content = [hocr_header]

              # 遍历MinerU输出的每一页
              for page_idx, page_data in enumerate(mineru_data.get("pages", [])):
                  page_width = page_data.get("width", 0)
                  page_height = page_data.get("height", 0)
                  # 添加页面级hOCR节点
                  hocr_content.append(f'''
              <div class='ocr_page' id='page_{page_idx+1}' title='image "{pdf_filename}"; bbox 0 0 {page_width} {page_height}; ppageno {page_idx+1}'>
                  <div class='ocr_carea' id='block_{page_idx+1}_1' title='bbox 0 0 {page_width} {page_height}'>
                  ''')

                  # 遍历段落/行/文字块
                  for block in page_data.get("preproc_blocks", []):
                      for para in block.get("para_blocks", []):
                          for line in para.get("lines", []):
                              line_bbox = line.get("bbox", [0,0,0,0])
                              # 行级节点（bbox格式：x0 y0 x1 y1）
                              hocr_content.append(f'''
                      <div class='ocr_line' id='line_{page_idx+1}_{line.get("line_id", 0)}' title='bbox {line_bbox[0]} {line_bbox[1]} {line_bbox[2]} {line_bbox[3]}; baseline 0 -0'>
                          ''')
                              # 遍历每个文字span
                              for span in line.get("spans", []):
                                  span_bbox = span.get("bbox", [0,0,0,0])
                                  span_text = span.get("content", "").replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")
                                  # 文字级节点
                                  hocr_content.append(f'''
                          <span class='ocrx_word' id='word_{page_idx+1}_{span.get("span_id", 0)}' title='bbox {span_bbox[0]} {span_bbox[1]} {span_bbox[2]} {span_bbox[3]}; x_wconf {int(span.get("score", 0)*100)}'>{span_text}</span>
                                  ''')
                              hocr_content.append('</div>')  # 闭合ocr_line

                  hocr_content.append('</div></div>')  # 闭合ocr_carea和ocr_page

              # 拼接完整hOCR内容并写入文件
              hocr_full = "".join(hocr_content) + hocr_footer
              with open(hocr_output_path, 'w', encoding='utf-8') as f:
                  f.write(hocr_full)

          if __name__ == "__main__":
              import sys
              mineru_output_dir = sys.argv[1]
              pdf_filename = sys.argv[2]
              hocr_output = sys.argv[3]
              convert_mineru_to_hocr(mineru_output_dir, pdf_filename, hocr_output)
          EOF

      - name: 执行转换脚本生成hOCR文件
        run: |
          source mineru-venv/bin/activate
          python3 mineru_to_hocr.py \
            mineru_output \
            "${{ github.event.inputs.pdf_file_path }}" \
            mineru_output/ocr_result.hocr
          deactivate
          # 验证hOCR文件生成
          if [ ! -f "mineru_output/ocr_result.hocr" ]; then
            echo "错误：hOCR文件生成失败！"
            exit 1
          fi

      - name: 核心步骤：适配hocr-pdf脚本规则，生成带文本层PDF
        run: |
          # 1. 安装pdf2image（拆分PDF为图片）和lxml（拆分hOCR）
          source mineru-venv/bin/activate
          pip install pdf2image lxml
          deactivate
          
          # 2. 创建工作文件夹，存放图片+拆分后的hOCR
          mkdir -p hocr_pdf_work
          
          # 3. 拆分原PDF为逐页JPG（300DPI，匹配OCR精度）
          source mineru-venv/bin/activate
          python3 -c "from pdf2image import convert_from_path; from pathlib import Path; pdf_path = '${{ github.event.inputs.pdf_file_path }}'; out_dir = 'hocr_pdf_work'; images = convert_from_path(pdf_path, dpi=300, fmt='jpg'); [img.save(Path(out_dir)/f'page_{idx:04d}.jpg', 'JPEG') for idx, img in enumerate(images, start=1)]; print(f'PDF拆分完成，生成{len(images)}张图片')"
          deactivate
          
          # 4. 拆分MinerU的单hocr文件为逐页hocr（和图片同名：page_0001.hocr/page_0001.jpg）
          cat > split_hocr.py << 'EOF'
          from lxml import etree, html
          from pathlib import Path

          def split_hocr(input_hocr, out_dir):
              # 读取原始hOCR
              parser = html.XHTMLParser()
              tree = etree.parse(input_hocr, parser)
              root = tree.getroot()
              
              # 查找所有页面节点
              page_nodes = root.xpath('//div[contains(@class, "ocr_page")]')
              print(f'检测到{len(page_nodes)}个页面，开始拆分')
              
              # 遍历页面，生成逐页hOCR
              for idx, page in enumerate(page_nodes, start=1):
                  page_num = f'{idx:04d}'
                  hocr_name = f'page_{page_num}.hocr'
                  out_path = Path(out_dir)/hocr_name
                    
                  # 构建单页hOCR的标准结构
                  html_elem = etree.Element('html', nsmap=root.nsmap if root.nsmap else {})
                  head = etree.SubElement(html_elem, 'head')
                  meta = etree.SubElement(head, 'meta', attrib={'http-equiv': 'Content-Type', 'content': 'text/html;charset=utf-8'})
                  body = etree.SubElement(html_elem, 'body')
                  body.append(page)
                    
                  # 写入文件
                  with open(out_path, 'wb') as f:
                      f.write(etree.tostring(html_elem, encoding='utf-8', pretty_print=True))
                  print(f'生成：{hocr_name}')
                
              return len(page_nodes)

          if __name__ == '__main__':
              import sys
              if len(sys.argv) != 3:
                  print('使用：python3 split_hocr.py <输入hocr> <输出目录>')
                  sys.exit(1)
              split_hocr(sys.argv[1], sys.argv[2])
          EOF
          
          # 执行拆分hOCR脚本
          source mineru-venv/bin/activate
          python3 split_hocr.py mineru_output/ocr_result.hocr hocr_pdf_work
          deactivate
          
          # 5. 验证工作文件夹内的文件匹配（图片和hocr数量一致）
          echo "=== 验证文件匹配 ==="
          img_count=$(ls -1 hocr_pdf_work/*.jpg | wc -l)
          hocr_count=$(ls -1 hocr_pdf_work/*.hocr | wc -l)
          echo "JPG图片数量：$img_count"
          echo "hOCR文件数量：$hocr_count"
          if [ $img_count -ne $hocr_count ]; then
            echo "错误：图片和hOCR文件数量不匹配！"
            exit 1
          fi
          
          # 6. 调用hocr-pdf核心脚本（仅传工作文件夹，适配其原生规则）
          echo "=== 开始生成带文本层PDF ==="
          python3 $(which hocr-pdf) hocr_pdf_work > "${{ github.event.inputs.output_pdf_name }}"
          
          # 7. 验证最终PDF生成
          if [ ! -f "${{ github.event.inputs.output_pdf_name }}" ]; then
            echo "错误：带文本层PDF生成失败！"
            exit 1
          fi
          echo "=== 生成成功 ==="
          ls -lh "${{ github.event.inputs.output_pdf_name }}"


      - name: 上传产物（最终PDF+hOCR中间文件）
        uses: actions/upload-artifact@v4
        with:
          name: mineru-ocr-results
          path: |
            ${{ github.event.inputs.output_pdf_name }}
            mineru_output/ocr_result.hocr
            mineru_output/*_middle.json  # 附带MinerU原始OCR结果，方便调试
          retention-days: 30
