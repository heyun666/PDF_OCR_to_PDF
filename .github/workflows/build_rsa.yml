name: Build patch_rsa_onebyte (MSVC x64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 安装 vcpkg 并缓存（vcpkg 在 windows-latest runner 上已预装）
      # ---------------------------------------------------------------
      - name: Setup vcpkg
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "C:\vcpkg"
          echo "VCPKG_ROOT=$env:VCPKG_ROOT" >> $env:GITHUB_ENV
          echo "$env:VCPKG_ROOT" >> $env:GITHUB_PATH
          & "$env:VCPKG_ROOT\vcpkg.exe" version

      # 缓存 vcpkg 已安装的包，加速后续构建
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-${{ runner.os }}-x64-windows-${{ hashFiles('.github/workflows/build_rsa.yml') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-

      # ---------------------------------------------------------------
      # 通过 vcpkg 安装  openssl（x64-windows 三元组）
      # ---------------------------------------------------------------
      - name: Install dependencies via vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install openssl:x64-windows

      # ---------------------------------------------------------------
      # 配置 MSVC 环境变量 (cl.exe, link.exe 等)
      # ---------------------------------------------------------------
      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---------------------------------------------------------------
      # 使用 MSVC 编译 patch_rsa_onebyte.cpp
      # ---------------------------------------------------------------
      - name: Compile with MSVC (cl.exe)
        shell: cmd
        run: |
          echo === Compiler version ===
          cl

          echo === Compiling patch_rsa_onebyte.cpp ===
          cl /nologo /EHsc /std:c++17 /MD /O2 /W3 ^
             /I "%VCPKG_ROOT%\installed\x64-windows\include" ^
             patch_rsa_onebyte.cpp ^
             /Fe:patch_rsa_onebyte.exe ^
             /link ^
             /LIBPATH:"%VCPKG_ROOT%\installed\x64-windows\lib" ^
             libcrypto.lib

      # ---------------------------------------------------------------
      # 收集运行时依赖的 DLL (OpenSSL) 供后续验证或打包
      # ---------------------------------------------------------------
      - name: Copy runtime DLLs
        shell: pwsh
        run: |
          $bin = "$env:VCPKG_ROOT\installed\x64-windows\bin"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item patch_rsa_onebyte.exe dist\
          Get-ChildItem "$bin\*.dll" | Where-Object {
              $_.Name -match '^(libcrypto|libssl)' 
          } | Copy-Item -Destination dist\
          Get-ChildItem dist

      # ---------------------------------------------------------------
      # 上传构建产物
      # ---------------------------------------------------------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: patch_rsa_onebyte-windows-x64
          path: dist/
          if-no-files-found: error
