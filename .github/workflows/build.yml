name: Build patch_rsa_onebyte (MSVC x64)- GUI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 定位 runner 上独立的 vcpkg（不要用 VS 自带的那个）
      # 用自定义变量 MY_VCPKG_ROOT 避免被 vcvarsall 覆盖
      # ---------------------------------------------------------------
      - name: Setup vcpkg
        shell: pwsh
        run: |
          # 候选路径：runner 预装的独立 vcpkg
          $candidates = @(
            "C:\vcpkg",
            "$env:VCPKG_INSTALLATION_ROOT",
            "C:\hostedtoolcache\vcpkg"
          ) | Where-Object { $_ -and (Test-Path "$_\vcpkg.exe") }

          if (-not $candidates) {
            Write-Error "No standalone vcpkg found. Candidates checked: C:\vcpkg, VCPKG_INSTALLATION_ROOT"
            Get-ChildItem C:\ -Directory | Select-Object Name
            exit 1
          }

          $vcpkgRoot = $candidates[0]
          Write-Host "Using standalone vcpkg at: $vcpkgRoot"
          "MY_VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & "$vcpkgRoot\vcpkg.exe" version

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-${{ runner.os }}-x64-windows-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-

      # ---------------------------------------------------------------
      # 安装 gmp 和 openssl，用 MY_VCPKG_ROOT 而不是 VCPKG_ROOT
      # ---------------------------------------------------------------
      - name: Install dependencies via vcpkg
        shell: pwsh
        run: |
          $v = $env:MY_VCPKG_ROOT
          Write-Host "Installing into: $v"
          & "$v\vcpkg.exe" install gmp:x64-windows openssl:x64-windows

          Write-Host "=== gmp headers ==="
          Get-ChildItem "$v\installed\x64-windows\include" -Filter "gmp*.h" -ErrorAction SilentlyContinue
          Write-Host "=== openssl rsa.h ==="
          Get-ChildItem "$v\installed\x64-windows\include\openssl\rsa.h" -ErrorAction SilentlyContinue

      # ---------------------------------------------------------------
      # MSVC 环境（会覆盖 VCPKG_ROOT，但我们不用那个变量了）
      # ---------------------------------------------------------------
      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---------------------------------------------------------------
      # 编译
      # ---------------------------------------------------------------
      - name: Compile with MSVC (cl.exe)
        shell: pwsh
        run: |
          $v    = $env:MY_VCPKG_ROOT
          $inc  = "$v\installed\x64-windows\include"
          $lib  = "$v\installed\x64-windows\lib"

          Write-Host "MY_VCPKG_ROOT = $v"
          Write-Host "Include dir exists: $(Test-Path $inc) -> $inc"
          Write-Host "Lib dir exists:     $(Test-Path $lib) -> $lib"

          if (-not (Test-Path "$inc\gmp.h")) {
            Write-Error "gmp.h not found in $inc"
            Get-ChildItem "$inc" -ErrorAction SilentlyContinue | Select-Object -First 50
            exit 1
          }

          cl /nologo /EHsc /std:c++17 /MD /O2 /W3 `
             /DNOMINMAX /D_CRT_SECURE_NO_WARNINGS /DOPENSSL_SUPPRESS_DEPRECATED `
             /I"$inc" `
             patch_rsa_onebyte.cpp `
             /Fe:patch_rsa_onebyte.exe `
             /link `
             /SUBSYSTEM:WINDOWS `
             /ENTRY:wWinMainCRTStartup `
             /LIBPATH:"$lib" `
             libcrypto.lib gmp.lib shell32.lib comctl32.lib user32.lib gdi32.lib

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ---------------------------------------------------------------
      # 收集运行时 DLL
      # ---------------------------------------------------------------
      - name: Copy runtime DLLs
        shell: pwsh
        run: |
          $bin = "$env:MY_VCPKG_ROOT\installed\x64-windows\bin"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item patch_rsa_onebyte.exe dist\
          Get-ChildItem "$bin\*.dll" -ErrorAction SilentlyContinue | Where-Object {
              $_.Name -match '^(libcrypto|libssl|gmp)'
          } | Copy-Item -Destination dist\
          Get-ChildItem dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: patch_rsa_onebyte-windows-x64
          path: dist/
          if-no-files-found: error
